name: Deploy dashboard (Static Web Apps)
on:
  push: { branches: [main], paths: ["dashboard/**"] }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}  # terraform output swa_deploy_token
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dashboard
          api_location: dashboard/api
          output_location: dist
